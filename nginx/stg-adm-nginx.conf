# Nginx configuration for stg-adm-im-ma.bservices-api.org.pk
# This configuration addresses security vulnerabilities identified in Acunetix audit
#
# IMPORTANT: Replace SSL certificate paths with proper certificate for stg-adm-im-ma.bservices-api.org.pk
# Current certificate is for 5.staging.averox.com which causes hostname mismatch

# Upstream configuration for Synapse
upstream synapse {
    server 127.0.0.1:8008;
    keepalive 32;
}

# Rate limiting zones
limit_req_zone $binary_remote_addr zone=matrix_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=static_limit:10m rate=50r/s;

# Client port (443) - for Matrix clients
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name stg-adm-im-ma.bservices-api.org.pk;

    # SSL Certificate Configuration
    # TODO: Replace with proper certificate for stg-adm-im-ma.bservices-api.org.pk
    # Current certificate is for 5.staging.averox.com - causes hostname mismatch
    ssl_certificate /etc/ssl/certs/stg-adm-im-ma.bservices-api.org.pk.crt;
    ssl_certificate_key /etc/ssl/private/stg-adm-im-ma.bservices-api.org.pk.key;
    
    # Strong TLS Configuration - Addresses weak cipher suites vulnerability
    # Only allow TLS 1.2 and 1.3 (disables TLS 1.0, 1.1)
    ssl_protocols TLSv1.2 TLSv1.3;
    
    # Strong cipher suites only - disables weak CBC ciphers
    # Based on Mozilla's "Modern" configuration
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;  # Prefer client cipher order for TLS 1.3
    
    # SSL Session Configuration
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;  # Disable session tickets for better security
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # Security Headers - Addresses missing security headers vulnerabilities
    # X-Content-Type-Options: Prevent MIME type sniffing
    add_header X-Content-Type-Options "nosniff" always;
    
    # Permissions-Policy: Restrict browser features
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    
    # Content-Security-Policy: Enhanced CSP (Synapse adds frame-ancestors, we add object-src)
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none';" always;
    
    # Referrer-Policy
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    
    # X-Frame-Options (redundant with CSP but for older browsers)
    add_header X-Frame-Options "DENY" always;
    
    # HSTS (HTTP Strict Transport Security) - Enable after confirming SSL works
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    
    # File upload size limit
    client_max_body_size 100M;
    
    # Timeouts
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;
    
    # Matrix API endpoints
    location ~ ^(/_matrix|/_synapse/client) {
        # Rate limiting
        limit_req zone=matrix_limit burst=20 nodelay;
        
        # Proxy configuration
        proxy_pass http://synapse;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # HTTP version
        proxy_http_version 1.1;
        
        # Connection keepalive
        proxy_set_header Connection "";
        
        # Buffering
        proxy_buffering off;
    }
    
    # Static files (login page, etc.)
    location /_matrix/static/ {
        # Rate limiting for static files
        limit_req zone=static_limit burst=50 nodelay;
        
        # Proxy configuration
        proxy_pass http://synapse;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # HTTP version
        proxy_http_version 1.1;
        
        # Cache static files
        proxy_cache_valid 200 1h;
        add_header Cache-Control "public, max-age=3600";
    }
    
    # Health check endpoint (no rate limiting)
    location /_matrix/client/versions {
        proxy_pass http://synapse;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        access_log off;
    }
    
    # Deny access to admin endpoints from public
    location /_synapse/admin {
        deny all;
        return 403;
    }
    
    # Default deny
    location / {
        return 404;
    }
}

# Federation port (8448) - for Matrix server-to-server communication
server {
    listen 8448 ssl http2;
    listen [::]:8448 ssl http2;
    server_name stg-adm-im-ma.bservices-api.org.pk;

    # SSL Certificate Configuration
    ssl_certificate /etc/ssl/certs/stg-adm-im-ma.bservices-api.org.pk.crt;
    ssl_certificate_key /etc/ssl/private/stg-adm-im-ma.bservices-api.org.pk.key;
    
    # Strong TLS Configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    
    # SSL Session Configuration
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;
    
    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=(), payment=(), usb=(), magnetometer=(), gyroscope=(), accelerometer=()" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; object-src 'none';" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    
    # File upload size limit
    client_max_body_size 100M;
    
    # Timeouts
    proxy_connect_timeout 600s;
    proxy_send_timeout 600s;
    proxy_read_timeout 600s;
    send_timeout 600s;
    
    # Federation endpoints (server-to-server)
    location ~ ^/_matrix {
        # Higher rate limit for federation
        limit_req zone=matrix_limit burst=50 nodelay;
        
        # Proxy configuration
        proxy_pass http://synapse;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # HTTP version
        proxy_http_version 1.1;
        
        # Connection keepalive
        proxy_set_header Connection "";
        
        # Buffering
        proxy_buffering off;
    }
    
    # Default deny
    location / {
        return 404;
    }
}

# HTTP to HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name stg-adm-im-ma.bservices-api.org.pk;
    
    # Redirect all HTTP traffic to HTTPS
    return 301 https://$server_name$request_uri;
}

# Redirect federation HTTP to HTTPS
server {
    listen 8448;
    listen [::]:8448;
    server_name stg-adm-im-ma.bservices-api.org.pk;
    
    return 301 https://$server_name:8448$request_uri;
}

