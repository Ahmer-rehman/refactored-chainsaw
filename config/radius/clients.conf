# RADIUS Clients Configuration
# Define which clients can connect to the RADIUS server

# Synapse server
client synapse {
    ipaddr = synapse
    secret = testing123
    require_message_authenticator = no
    nas_type = other
}

# Localhost (for testing)
client localhost {
    ipaddr = 127.0.0.1
    secret = testing123
    require_message_authenticator = no
    nas_type = other
}

# Docker network
client docker_network {
    ipaddr = 172.16.0.0/12
    secret = testing123
    require_message_authenticator = no
    nas_type = other
}
